version: 2

project_name: cmdk

before:
  hooks:
    - go mod tidy

builds:
  - id: cmdk
    main: .
    binary: cmdk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: cmdk
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

brews:
  - name: cmdk
    repository:
      owner: mieubrisse
      name: homebrew-cmdk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/mieubrisse/cmdk"
    description: "Terminal file navigator — ⌘-K for your shell"
    license: "MIT"
    dependencies:
      - name: fzf
      - name: fd
    install: |
      bin.install "cmdk"
    test: |
      system "#{bin}/cmdk", "--help"
